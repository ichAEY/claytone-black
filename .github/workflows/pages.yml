name: Build and deploy ClayTone Black

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: claytone-black-pages
  cancel-in-progress: true

env:
  SOURCE_REPOSITORY: ichAEY/claytone-current
  SOURCE_COMMIT: ce1bd42b44e76e1851af9e069c4cbcf06fc8eac2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ClayTone Black
        uses: actions/checkout@v4

      - name: Checkout current Nonna production source
        run: |
          git clone --no-tags https://github.com/${SOURCE_REPOSITORY}.git site
          cd site
          git checkout ${SOURCE_COMMIT}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install production dependencies
        working-directory: site
        run: npm ci

      - name: Apply current centralized Nonna data
        working-directory: site
        run: node scripts/generate-site.mjs

      - name: Apply ClayTone Black theme
        run: |
          cp dark-theme.css site/app/dark-theme.css
          node scripts/prepare-site.mjs site

      - name: Remove stale exported Next assets
        run: rm -rf site/public/_next

      - name: Ignore hosting-only TypeScript files
        working-directory: site
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = 'tsconfig.json';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          config.exclude = [
            ...(config.exclude || []),
            'db/**',
            'worker/**',
            'examples/**',
            'build/**',
            'drizzle/**',
            'drizzle.config.ts',
            'vite.config.ts'
          ];
          fs.writeFileSync(path, JSON.stringify(config, null, 2) + '\n');
          NODE

      - name: Build static dark site
        working-directory: site
        run: npx next build

      - name: Upload build output for inspection
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: claytone-black-preview
          path: site/out
          retention-days: 3

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/out

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
