name: Materialize current ClayTone source

on:
  push:
    branches: [feat/dark-claytone]
    paths: [MATERIALIZE_SOURCE]

permissions:
  contents: write

env:
  SOURCE_REPOSITORY: ichAEY/claytone-current
  SOURCE_COMMIT: ce1bd42b44e76e1851af9e069c4cbcf06fc8eac2

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ClayTone Black branch
        uses: actions/checkout@v4
        with:
          ref: feat/dark-claytone
          fetch-depth: 0

      - name: Fetch production source snapshot
        run: |
          git clone --no-tags https://github.com/${SOURCE_REPOSITORY}.git /tmp/claytone-source
          cd /tmp/claytone-source
          git checkout ${SOURCE_COMMIT}
          rm -rf .git

      - name: Copy full site into this repository
        run: |
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='README.md' \
            /tmp/claytone-source/ ./
          rm -f CNAME public/CNAME
          cp dark-theme.css app/dark-theme.css

      - name: Load dark theme last
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const file = 'app/layout.tsx';
          let text = fs.readFileSync(file, 'utf8');
          const darkImport = 'import "./dark-theme.css";';
          if (!text.includes(darkImport)) {
            const anchor = 'import "./android-scroll-safety.css";';
            if (!text.includes(anchor)) throw new Error('Production CSS import anchor not found');
            text = text.replace(anchor, `${anchor}\n${darkImport}`);
            fs.writeFileSync(file, text);
          }
          NODE

      - name: Review imported paths
        run: git status --short

      - name: Stage imported source explicitly
        run: |
          python - <<'PY'
          import subprocess
          raw = subprocess.check_output(['git', 'status', '--porcelain=v1', '-z'])
          for record in raw.split(b'\0'):
              if not record:
                  continue
              path = record[3:].decode('utf-8')
              subprocess.check_call(['git', 'add', '--', path])
          PY

      - name: Commit imported production snapshot
        run: |
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Import current ClayTone production source"
          git push origin HEAD:feat/dark-claytone
